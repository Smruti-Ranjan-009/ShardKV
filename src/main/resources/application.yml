spring:
  application:
    name: shardkv

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      node: ${SHARDKV_NODE_ID:node-1}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        shardkv.query.duration: true

server:
  port: ${SERVER_PORT:8081}

shardkv:
  node:
    id: ${SHARDKV_NODE_ID:node-1}
    host: ${SHARDKV_NODE_HOST:localhost}
    port: ${SERVER_PORT:8081}
  cluster:
    members: "${SHARDKV_CLUSTER_MEMBERS:node-1,localhost,8081;node-2,localhost,8082;node-3,localhost,8083}"
    virtual-nodes: ${SHARDKV_VIRTUAL_NODES:128}
    connect-timeout: ${SHARDKV_CONNECT_TIMEOUT:2s}
    read-timeout: ${SHARDKV_READ_TIMEOUT:5s}
  replication:
    factor: ${SHARDKV_REPLICATION_FACTOR:3}
  consistency:
    default-level: ${SHARDKV_DEFAULT_CONSISTENCY:QUORUM}
  failure-detection:
    interval: ${SHARDKV_HEARTBEAT_INTERVAL:2s}
    failure-threshold: ${SHARDKV_FAILURE_THRESHOLD:3}
    recovery-threshold: ${SHARDKV_RECOVERY_THRESHOLD:2}
  storage:
    data-dir: ${SHARDKV_DATA_DIR:./data}
  indexing:
    fields: ${SHARDKV_INDEX_FIELDS:city,role,experience,active}
  query:
    max-results: ${SHARDKV_QUERY_MAX_RESULTS:1000}
    parallelism: ${SHARDKV_QUERY_PARALLELISM:8}
    queue-capacity: ${SHARDKV_QUERY_QUEUE_CAPACITY:100}
