name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHARDKV_IMAGE_TAG: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B -ntp clean test

      - name: Package application
        run: ./mvnw -B -ntp clean package

      - name: Build ShardKV image
        run: docker build --tag "shardkv:${SHARDKV_IMAGE_TAG}" .

      - name: Validate Compose configuration
        run: docker compose --project-name shardkv --file docker-compose.yml config --quiet

      - name: Start containerized cluster
        run: docker compose --project-name shardkv --file docker-compose.yml up --detach --no-build --wait

      - name: Run container smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -VerifyPersistence

      - name: Capture container logs on failure
        if: failure()
        run: docker compose --project-name shardkv --file docker-compose.yml logs --no-color

      - name: Clean up containers and volumes
        if: always()
        run: docker compose --project-name shardkv --file docker-compose.yml down --volumes --remove-orphans
