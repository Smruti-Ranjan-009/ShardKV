global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: shardkv
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
        labels:
          shardkv_node: node-1
      - targets:
          - host.docker.internal:8082
        labels:
          shardkv_node: node-2
      - targets:
          - host.docker.internal:8083
        labels:
          shardkv_node: node-3
